<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Husqvarna to MQTT - ESP32 Flasher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status-box {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
        }

        .status-box.connected {
            border-left-color: #10b981;
            background: #ecfdf5;
            color: #065f46;
        }

        .status-box.error {
            border-left-color: #ef4444;
            background: #fef2f2;
            color: #7f1d1d;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .button-group.full {
            grid-template-columns: 1fr;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            margin-bottom: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e5e5e5;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }

        .log {
            background: #1e1e1e;
            color: #0f0;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            display: none;
            line-height: 1.4;
        }

        .log.active {
            display: block;
        }

        .log-line {
            margin: 2px 0;
        }

        .info {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #1e40af;
            margin-bottom: 20px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Husqvarna MQTT</h1>
        <p class="subtitle">ESP32 Firmware Flasher</p>

        <div class="info">
            Make sure your ESP32 is connected via USB and powered on.
        </div>

        <div class="status-box" id="status">
            Ready to connect. Press the button below to begin.
        </div>

        <div class="button-group">
            <button id="btnConnect" class="btn-primary">
                Connect
            </button>
            <button id="btnDisconnect" class="btn-secondary" disabled>
                Disconnect
            </button>
        </div>

        <button id="btnFlash" class="btn-primary button-group full" disabled>
            ⚡ Flash Firmware
        </button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script type="module">
        // esptool-js is shipped as an ES module (named exports), so it must be
        // imported — it does NOT attach globals to window. Pin the version: an
        // unpinned/non-existent tag 404s and leaves ESPLoader/Transport undefined.
        import { ESPLoader, Transport } from "https://cdn.jsdelivr.net/npm/esptool-js@0.6.0/bundle.js";

        let transport = null;   // esptool-js Transport wrapping the Web Serial port
        let device = null;      // the raw SerialPort chosen by the user
        let isFlashing = false;

        // Flash-phase baud rate. main() first talks to the ROM at 115200 and then
        // switches up to this. 460800 is reliable on the CH340/CP2102 USB-serial
        // chips used on the Freenove ESP32-WROOM board (higher rates can be flaky).
        const FLASH_BAUD = 460800;

        // Firmware files (relative to the GitHub Pages root) and their flash offsets,
        // taken from this project's partition table: bootloader 0x1000, partition
        // table 0x8000, otadata 0xe000, app0 0x10000. esptool-js calls this "address".
        const FIRMWARE_FILES = [
            { path: 'bootloader.bin', address: 0x1000 },
            { path: 'partitions.bin', address: 0x8000 },
            { path: 'ota_data_initial.bin', address: 0xe000 },
            { path: 'firmware.bin', address: 0x10000 }
        ];

        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const btnFlash = document.getElementById('btnFlash');

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status-box ${type === 'connected' ? 'connected' : type === 'error' ? 'error' : ''}`;
        }

        function log(message) {
            const logEl = document.getElementById('log');
            logEl.classList.add('active');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = message;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateProgress(percent, message) {
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = message;
        }

        // esptool-js writes diagnostics through an IEspLoaderTerminal; route them to
        // the on-page log. writeLine = full line, write = partial (e.g. "...." dots).
        const espTerminal = {
            clean() { document.getElementById('log').innerHTML = ''; },
            writeLine(data) { log(data); },
            write(data) {
                const logEl = document.getElementById('log');
                logEl.classList.add('active');
                let last = logEl.lastElementChild;
                if (!last) { last = document.createElement('div'); last.className = 'log-line'; logEl.appendChild(last); }
                last.textContent += data;
                logEl.scrollTop = logEl.scrollHeight;
            }
        };

        async function connectSerial() {
            try {
                if (!('serial' in navigator)) {
                    updateStatus('Web Serial API not supported in this browser. Use Chrome, Edge, or Brave on desktop.', 'error');
                    return;
                }

                // Always let the user pick the port explicitly (avoids grabbing a
                // previously-authorised, unrelated device). Do NOT open it here —
                // esptool-js opens/resets the port itself inside main().
                device = await navigator.serial.requestPort();
                transport = new Transport(device, false);

                log('Serial port selected.');
                updateStatus('✓ Port selected — click "Flash Firmware" to begin.', 'connected');

                btnConnect.disabled = true;
                btnDisconnect.disabled = false;
                btnFlash.disabled = false;
            } catch (error) {
                if (error.name === 'NotFoundError') {
                    updateStatus('No port selected. Please pick your ESP32 COM port.', 'error');
                } else {
                    updateStatus(`Connection error: ${error.message}`, 'error');
                    log(`Error: ${error.message}`);
                }
            }
        }

        async function disconnectSerial() {
            try {
                if (transport) {
                    await transport.disconnect();
                    transport = null;
                }
                device = null;

                updateStatus('Disconnected', 'info');
                btnConnect.disabled = false;
                btnDisconnect.disabled = true;
                btnFlash.disabled = true;
                document.getElementById('progressContainer').style.display = 'none';
                log('Disconnected');
            } catch (error) {
                updateStatus(`Disconnect error: ${error.message}`, 'error');
            }
        }

        async function flashFirmware() {
            if (isFlashing || !transport) {
                return;
            }

            isFlashing = true;
            btnFlash.disabled = true;
            btnConnect.disabled = true;
            btnDisconnect.disabled = true;

            try {
                // 1) Download the firmware images first (fast, and fails loudly if a
                //    .bin is missing before we touch the chip).
                updateProgress(0, 'Downloading firmware…');
                const fileArray = [];
                for (const file of FIRMWARE_FILES) {
                    log(`Downloading ${file.path}…`);
                    const response = await fetch(file.path);
                    if (!response.ok) throw new Error(`Failed to fetch ${file.path} (HTTP ${response.status})`);
                    const data = new Uint8Array(await response.arrayBuffer());
                    fileArray.push({ data, address: file.address });
                }

                // 2) Connect to the ROM bootloader and detect the chip. main() opens
                //    the serial port, resets into download mode and returns the chip name.
                updateProgress(10, 'Connecting to bootloader…');
                log('Connecting to ESP32 bootloader…');
                const esploader = new ESPLoader({ transport, baudrate: FLASH_BAUD, terminal: espTerminal });
                const chip = await esploader.main();
                log(`Detected chip: ${chip}`);

                // 3) Erase the whole flash and write every image in one transaction.
                //    'keep' preserves the flash mode/freq/size encoded in the image headers.
                updateProgress(20, 'Erasing & writing flash…');
                const totalFiles = fileArray.length;
                await esploader.writeFlash({
                    fileArray,
                    flashSize: 'keep',
                    flashMode: 'keep',
                    flashFreq: 'keep',
                    eraseAll: true,
                    compress: true,
                    reportProgress: (fileIndex, written, total) => {
                        const fileName = FIRMWARE_FILES[fileIndex].path;
                        const filePct = total ? Math.round((written / total) * 100) : 0;
                        const overall = 20 + Math.round(((fileIndex + (total ? written / total : 0)) / totalFiles) * 75);
                        updateProgress(overall, `Writing ${fileName} (${filePct}%)`);
                    }
                });

                // 4) Reboot into the freshly flashed application.
                updateProgress(98, 'Rebooting…');
                log('Flash complete — rebooting into firmware…');
                await esploader.after('hard_reset');

                updateProgress(100, 'Done!');
                updateStatus('✓ Firmware flashed successfully! The device is rebooting…', 'connected');
                log('Done. The ESP32 will boot the new firmware and start its WiFi setup access point.');
            } catch (error) {
                updateStatus(`Flash failed: ${error.message}`, 'error');
                log(`ERROR: ${error.message}`);
                if (error.stack) log(error.stack);
            } finally {
                isFlashing = false;
                btnFlash.disabled = false;
                btnConnect.disabled = false;
                btnDisconnect.disabled = false;
            }
        }

        btnConnect.addEventListener('click', connectSerial);
        btnDisconnect.addEventListener('click', disconnectSerial);
        btnFlash.addEventListener('click', flashFirmware);

        // Check for Web Serial API support on load (module scripts run after parse).
        if (!('serial' in navigator)) {
            updateStatus('Web Serial API not supported. Use Chrome, Edge, or Brave on desktop.', 'error');
            btnConnect.disabled = true;
        }
    </script>
</body>
</html>
